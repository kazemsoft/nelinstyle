name: Deploy stage
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy-stage
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  deploy:
    # Self-hosted runner on omid-server (label nelin-stage).
    runs-on: [self-hosted, nelin-stage]
    environment:
      name: stage
      url: https://www.nelinstyle.com
    steps:
      - uses: actions/checkout@v7
      - name: Build and restart container
        # Docker Hub intermittently returns 403 from this network; retry.
        run: |
          for i in 1 2 3; do
            docker compose -f deploy/compose.stage.yml up -d --build --remove-orphans && exit 0
            sleep 20
          done
          exit 1
      - name: Health check
        run: |
          for i in $(seq 30); do
            docker exec nelin-stage wget -q -O /dev/null http://127.0.0.1:3000/fa && exit 0
            sleep 2
          done
          docker logs --tail 50 nelin-stage; exit 1
      - name: Remove dangling images
        run: docker image prune -f --filter label=com.docker.compose.project=nelin-stage
